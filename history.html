<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>ODDSUP - History</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>

/*==========================
    GOOGLE FONT
==========================*/

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');


/*==========================
      RESET
==========================*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;

    padding:20px;

    background:
    linear-gradient(
    180deg,
    #010700,
    #000000,
    #001404);

}

/*==========================
     MAIN CONTAINER
==========================*/


.container{

    width:100%;
    max-width:420px;
    height: 100%;

}



/*==========================
         HEADER
==========================*/


header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

}


.header-logo{

    width:170px;

    display:block;
    height: 50px;

}

/*==================
    USER INFO
===================*/

.user-info{

    display:flex;

    align-items:center;

    gap:10px;

    cursor:pointer;

}


#balance{

    color:white;

    font-size:18px;

    font-weight:700;

}


.profile-image{

    width:35px;
    height:35px;

    border-radius:50%;

    background:#1775ff;

    color:white;

    font-size:15px;
    font-weight:bold;

    display:flex;

    justify-content:center;
    align-items:center;

    cursor:pointer;

}


.hidden{

    display:none !important;

}


/*==========================
        IMAGE SLIDER
==========================*/


.slider{

    width:100%;

    overflow:hidden;

    margin-top:0px;

    border-radius:0px;

}


.slider-track{

    display:flex;

    transition:1s ease;

}


.slider img{

    min-width:100%;

    height:120px;

    object-fit:cover;

}



/*==========================
      INFORMATION BOX
==========================*/


.info-box{

    margin-top:5px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:10px;

    gap:20px;

    border-radius:0px;

    overflow:hidden;

    background:
    linear-gradient(
    180deg,
    #02280500,
    #03381746);

    border:2px solid #096e05;
    height: 35px;

}



/* PLAYERS */

.players{

    display:flex;

    align-items:center;

    gap:10px;

    color:white;

    font-weight:700;

    flex-shrink:0;

}


.players i{

    color:#ffc400;

    font-size:18px;

}


.players span{

    font-size:16px;

}



/* DIVIDER */

.divider{

    width:2px;

    height:40px;

    background:#0a5fd1;

    flex-shrink:0;

}



/* WINNERS */

.winner-container{

    overflow:hidden;

    width:100%;

}


.winner-scroll{

    white-space:nowrap;

    color:#55ff55;

    font-weight:700;

    animation:

    scroll 18s linear infinite;

}


@keyframes scroll{

    0%{

        transform:
        translateX(100%);

    }


    100%{

        transform:
        translateX(-100%);

    }

}



/*==========================
        GAME BOX
==========================*/


.game-box{

width:100%;

min-height:330px;

margin-top:0px;

border-radius:5px;

overflow:hidden;

position:relative;

display:flex;

justify-content:center;

align-items:center;


background-image:

url("background.png");


background-size:cover;

background-position:center;


border:2px solid #00a716;

}

.center-logo{

width:65%;

position:relative;

z-index:5;

}

.particles{

position:absolute;

inset:0;

overflow:hidden;

}


.arrow{

position:absolute;

bottom:-30px;

color:white;

font-size:18px;

opacity:.8;

animation:

moveUp linear forwards;

}

@keyframes moveUp{


0%{

transform:

translateY(0);

opacity:0;

}


20%{

opacity:1;

}


100%{

transform:

translateY(-750px);

opacity:0;

}


}



/*==========================
       GAME LOGO
==========================*/


.game-logo{

    position:relative;

    z-index:2;

    text-align:center;

    font-size:5rem;

    font-weight:800;

    font-style:italic;

    color:white;

}


.game-logo span{

    color:#ffc400;

}



/*==========================
      PLAY BUTTON
==========================*/


.play-btn{


    margin-top:auto;

    width:40%;

    border:none;

    border-radius:25px;

    background:
    linear-gradient(
    180deg,
    #2b700b,
    #2f7d11);

    color:white;

    font-size:1rem;

    font-weight:800;

    cursor:pointer;

    transition:.3s;
    
    height: 35px;
    
    margin-left: 120px;
}


.play-btn:hover{

    transform:scale(1.05);

}


.play-btn i{

    margin-right:8px;

}

/*=========================
        POPUP
=========================*/


.demo-btn{

    width:100%;

    padding:18px;

    border:none;

    border-radius:20px;

    cursor:pointer;

    font-weight:bold;

    margin-top:5px;

}



.login-popup{

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.8);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:1000;

}


.login-box{

    width:90%;

    max-width:350px;

    padding:30px;

    border-radius:25px;

    text-align:center;

    background:#04162d;

}


.popup-login,
.popup-cancel{

    width:100%;

    padding:15px;

    border:none;

    border-radius:20px;

    margin-top:15px;

    cursor:pointer;

}


.popup-login{

    background:#52c31f;

}


.popup-cancel{

    background:red;

}


.hidden{

    display:none !important;

}


/*==========================
      NAVIGATION BAR
==========================*/


nav{

    position:fixed;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:100%;

    max-width:420px;

    display:flex;

    justify-content:space-around;

    gap:10px;

    padding:10px;

    border-radius:15px 15px 0 0;

    background:
    linear-gradient(
    180deg,
    #032802,
    #033815);

    z-index:1000;

}


.nav-item{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:8px;

    color:#d3d3d3;

    cursor:pointer;

}


.nav-item i{

    font-size:1rem;

}


.nav-item span{

    font-size:.8rem;

    font-weight:700;

}


.active{

    color:#ffc400;

}

/*=====================
      HISTORY BOX
=====================*/

.history-box{

    flex:1;

    width:100%;

    display:flex;

    flex-direction:column;

    margin-top:15px;

    padding:40px;

    border-radius:10px;
    min-height:73vh;

}


#history-container{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

}

.empty-history{

    width:100%;

    text-align:center;

}


.history-box h2{

    color:white;

    text-align:center;

}
/*=====================
      HISTORY NAV
=====================*/

.history-nav{

    display:flex;

    justify-content:space-between;

    margin-top:25px;

}


.history-item{

    flex:1;

    text-align:center;

    color:#bdbdbd;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;

}


.history-item.active{

    color:#ffc400;

}


/*=====================
      SLIDER
=====================*/

.history-slider{

    width:25%;

    height:3px;

    border-radius:20px;

    background:#ffc400;

    margin-top:10px;

    transition:.4s ease;

}


.history-line{

    width:100%;

    height:1px;

    background:#ffc400;

    margin-top:0px;

}


/*=====================
     EMPTY HISTORY
=====================*/

.empty-history{

    flex:1;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

}


.empty-history i{

    font-size:60px;

    color:#ffc400;

}


.empty-history h3{

    color:white;

    margin-top:20px;

}


.empty-history p{

    color:#cfcfcf;

    margin-top:10px;

}

/*==========================
      RESPONSIVE
==========================*/


@media(max-width:500px){


    .logo{

        font-size:2.2rem;

    }


    .game-logo{

        font-size:4rem;

    }


    .play-btn{

        font-size:1rem;

    }


}

</style>

</head>
<body2>


<div class="container2">


<!--==================
       HEADER
===================-->

<header>

    <img
    src="oddsuplogo.png"
    class="header-logo"
    alt="ODDSUP">


    <div class="user-info"
    id="user-info">

        <h3 id="balance">

            NGN 0.00

        </h3>


        <div class="profile-image"
        id="profile-image">

            

        </div>

    </div>

</header>



<!--==================
      HISTORY
===================-->

<section class="history-box">

    <h2>HISTORY</h2>

    <div class="history-nav">

        <span class="history-item active">
            ALL
        </span>

        <span class="history-item">
            WITHDRAW
        </span>

        <span class="history-item">
            DEPOSIT
        </span>

        <span class="history-item">
            GAME
        </span>

    </div>

    <div class="history-slider"></div>

    <div class="history-line"></div>


    <div id="history-container">

        <div class="empty-history">

            <i class="fa-solid fa-clock-rotate-left"></i>

            <h3>
                No History Available
            </h3>

            <p>
                Your transactions and games
                will appear here.
            </p>

        </div>

    </div>

</section>




<!--==================
       NAV BAR
===================-->

<nav>

    <div class="nav-item"
    data-page="home1.html">

        <i class="fa-solid fa-house"></i>
        <span>HOME</span>

    </div>


    <div class="nav-item active"
    data-page="history.html">

        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>HISTORY</span>

    </div>



    <div class="nav-item"
    data-page="profile.html">

        <i class="fa-solid fa-user"></i>
        <span>PROFILE</span>

    </div>

</nav>


</div>


<script>
//=====================
// CURRENT USER
//=====================

const currentUser =

JSON.parse(

localStorage.getItem(
"currentUser")

);


//=====================
// USER INFO
//=====================

if(currentUser){


document.getElementById(
"balance"
).innerText=

"NGN "+currentUser.balance+".00";



document.getElementById(
"profile-image"
).innerText=

currentUser.username[0]
.toUpperCase();


}



//=====================
// PROFILE
//=====================

document.getElementById(
"profile-image"
).onclick=()=>{

window.location.href=
"profile.html";

};


document.getElementById(
"balance"
).onclick=()=>{

window.location.href=
"profile.html";

};


//=====================
// HISTORY FILTERS
//=====================

const historyItems =
document.querySelectorAll(".history-item");

const historySlider =
document.querySelector(".history-slider");


historyItems.forEach((item,index)=>{

    item.onclick=()=>{


        historyItems.forEach((nav)=>{

            nav.classList.remove("active");

        });


        item.classList.add("active");


        historySlider.style.transform=

        `translateX(${index*100}%)`;


    };


});


//==========================
// BOTTOM NAVIGATION
//==========================

const navItems =

document.querySelectorAll(".nav-item");


navItems.forEach((item)=>{

    item.onclick = ()=>{

        window.location.href =

        item.dataset.page;

    };

});
</script>

</body2>
</html>
