<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    overflow:hidden;

    /* Background Image */
    background:
    linear-gradient(
    180deg,
    #010700,
    #000000,
    #001404);
}

/* Dark overlay for readability */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:-1;
}

.container{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* Loading Spinner */
.spinner{
    position:relative;
    width:70px;
    height:70px;
}

.spinner span{
    position:absolute;
    left:50%;
    top:50%;
    width:4px;
    height:12px;
    margin-left:-2px;
    margin-top:-30px;
    border-radius:10px;
    background:white;
    transform-origin:center 30px;
    animation:fade 1.2s linear infinite;
}

.spinner span:nth-child(1){transform:rotate(0deg);animation-delay:-1.1s;}
.spinner span:nth-child(2){transform:rotate(30deg);animation-delay:-1.0s;}
.spinner span:nth-child(3){transform:rotate(60deg);animation-delay:-0.9s;}
.spinner span:nth-child(4){transform:rotate(90deg);animation-delay:-0.8s;}
.spinner span:nth-child(5){transform:rotate(120deg);animation-delay:-0.7s;}
.spinner span:nth-child(6){transform:rotate(150deg);animation-delay:-0.6s;}
.spinner span:nth-child(7){transform:rotate(180deg);animation-delay:-0.5s;}
.spinner span:nth-child(8){transform:rotate(210deg);animation-delay:-0.4s;}
.spinner span:nth-child(9){transform:rotate(240deg);animation-delay:-0.3s;}
.spinner span:nth-child(10){transform:rotate(270deg);animation-delay:-0.2s;}
.spinner span:nth-child(11){transform:rotate(300deg);animation-delay:-0.1s;}
.spinner span:nth-child(12){transform:rotate(330deg);animation-delay:0s;}

@keyframes fade{
    from{
        opacity:1;
    }
    to{
        opacity:.15;
    }
}

/* Error Message */
#error{
    display:none;
    max-width:350px;
}

#error h1{
    font-size:60px;
    color:red;
    margin-bottom:10px;
}

#error .title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

#error .payment-text{
    font-size:18px;
    color:#dddddd;
    line-height:1.5;
}

/* Back Button */
#backBtn{
    margin-top:30px;
    padding:14px 40px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:white;
    color:black;
    transition:.3s ease;
}

#backBtn:hover{
    opacity:.85;
}
</style>
</head>

<body>

<div class="container">

    <!-- Loading Animation -->
    <div id="loader" class="spinner">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <!-- Error Message -->
    <div id="error">
        <h1>!</h1>

        <p class="title">API Unavailable</p>

        <p class="payment-text">
            Try another payment method.
        </p>

        <button id="backBtn" onclick="window.location.href='deposit.html'">
    Back
</button>
    </div>

</div>

<script>
// Show API unavailable message after 5 seconds
setTimeout(function(){

    document.getElementById("loader").style.display = "none";
    document.getElementById("error").style.display = "block";

}, 5000);
</script>

</body>
</html>
