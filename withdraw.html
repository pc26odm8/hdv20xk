<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>ODDSUP | Withdraw</title>

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}


body{

    font-family:'Poppins',sans-serif;

    background:black;

    min-height:100vh;

    display:flex;
    justify-content:center;

    padding:20px;

}


.container{

    width:100%;
    max-width:420px;

    height:100%;

}



/*===================
        HEADER
===================*/


header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

    background:black;

}


.header-logo{

    width:170px;

    display:block;
    height: 50px;

}




/*===================
       BALANCE
===================*/


.balance-box{

    margin-top:20px;

    padding:20px;

    display:flex;

    justify-content:space-between;
    align-items:center;

}


.balance-box h3{

    color:white;

    font-size:12px;

}


.balance-box h2{

    color:white;

    font-size:15px;

}




/*===================
        TITLE
===================*/


.withdraw-title{

        color:white;

    font-size:12px;

    margin-top:13px;

    text-align:center;

    margin-right:70px;


}




/*===================
     WITHDRAW BOX
===================*/


.amount-box{

display:flex;
gap:10px;
margin-top:10px;
margin-left:15px;

}


.amount-box input{

width:150px;
height:45px;
padding:18px;
font-size:16px;
border:1px solid #00ff00;
outline:none;
border-radius:10px;
background:#dddddd;


}


.amount-info{

display:flex;
flex-direction:column;
justify-content:center;
gap:10px;
font-size:14px;
font-weight:bold;
color: #bdbdbd;

}

.amount-error{

    margin-top:10px;

    margin-left:15px;

    color:red;

    font-size:13px;

    font-weight:bold;

}


.input-error{

    border:2px solid red !important;

}

/* REMOVE INPUT ARROWS */

input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button{

    -webkit-appearance:none;

    margin:0;

}


input[type=number]{

    -moz-appearance:textfield;

}



/*===================
        AMOUNT
===================*/


.amount-row{

    display:flex;

    gap:15px;

}


#amount{

    width:190px;
    height:50px;

}


.limits{

    font-size:12px;

    font-weight:bold;

    line-height:22px;

}

label{

color: white;

}

.select-box{

border-radius:10px;

}


/*===================
        INPUTS
===================*/


.withdraw-box input{

    width:100%;
    height:50px;

    padding-left:15px;

    font-size:18px;

    outline:none;

    border:1px solid green;
border-radius:10px;

}


.withdraw-box input:focus{

    border:2px solid black;

}


#account-number{

    margin-top:5px;

}


#account-name{

    margin-top:5px;

}




/*===================
      SELECT BANK
===================*/


#bank{

    width:100%;
    height:50px;

    padding-left:15px;

    font-size:18px;

    cursor:pointer;

    outline:none;

    border:1px solid black;

}


#bank:focus{

    border:2px solid black;

}




/*===================
     ERROR MESSAGE
===================*/


.error-message{

    color:red;

    font-size:13px;

    min-height:18px;

    margin-top:8px;
    margin-bottom:20px;

}




/*===================
        BUTTONS
===================*/


.buttons{

    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-top:30px;

}


.buttons button{

    width:25%;

    padding:15px;

    border:none;

    cursor:pointer;

    border-radius:20px;

    margin-top:px;

    font-size:14px;

    font-weight:bold;

    background:#01a51d;

    color:white;

    transition:.3s;

}


.buttons button:hover{


transform:scale(1.03);


    box-shadow:

    0 0 25px #00ff00;


}




/*===================
      RESPONSIVE
===================*/


@media(max-width:480px){


.amount-row{

    gap:10px;

}


#amount{

    width:140px;

}


.limits{

    font-size:11px;

}


.withdraw-box input,
#bank{

    font-size:18px;

}


.buttons button{

    width:120px;

    font-size:15px;

}


}

</style>
</head>


<body>


<div class="container">


<!--==================
        HEADER
===================-->

<header>

<img src="oddsuplogo.png"
class="header-logo"
alt="ODDSUP">

</header>




<!--==================
       BALANCE
===================-->

<section class="balance-box">

<h3>

CURRENT BALANCE

</h3>


<h2>

NGN <span id="balance">

0.00

</span>

</h2>


</section>





<!--==================
         TITLE
===================-->

<h3 class="withdraw-title">

WITHDRAW MONEY FROM YOUR
ODDSUP ACCOUNT

</h3>


<!-- AMOUNT -->


<div class="amount-box">

<input
type="number"
id="amount"
placeholder="Enter amount">


<div class="amount-info">

<p>

Min NGN 3000.00

</p>

<p>

Max NGN 500,000.00

</p>

</div>

</div>



<p class="error-message"
id="amount-error">

</p>


<!--==================
      WITHDRAW BOX
===================-->

<section class="withdraw-box">


<!-- ACCOUNT NUMBER -->

<label>

ACCOUNT NUMBER

</label>


<input type="text"
id="account-number"
maxlength="10"
placeholder="ENTER ACCOUNT NUMBER">


<p class="error-message"
id="number-error">

</p>





<!-- ACCOUNT NAME -->

<label>

ACCOUNT NAME

</label>


<input type="text"
id="account-name"
placeholder="ENTER ACCOUNT NAME">


<p class="error-message"
id="name-error">

</p>





<!-- BANK -->

<label>

SELECT BANK

</label>


<select class="select-box" id="bank">

<option value="">

SELECT BANK

</option>


<option>

Access Bank

</option>


<option>

Zenith Bank

</option>


<option>

GTBank

</option>


<option>

UBA

</option>


<option>

First Bank

</option>


<option>

Moniepoint

</option>


<option>

Opay

</option>


<option>

Palmpay

</option>


<option>

Kuda Bank

</option>


<option>

FCMB

</option>


<option>

Sterling Bank

</option>


<option>

Union Bank

</option>


<option>

Fidelity Bank

</option>


<option>

Wema Bank

</option>


<option>

Keystone Bank

</option>


</select>


<p class="error-message"
id="bank-error">

</p>





<!--==================
        BUTTONS
===================-->

<div class="buttons">


<button id="back-btn">

< &nbsp; BACK

</button>



<button id="confirm-btn">

CONFIRM

</button>


</div>



</section>



</div>



<script>


//=========================
// AMOUNT
//=========================

const amountInput =

document.getElementById(

"amount"

);


const amountError =

document.getElementById(

"amount-error"

);



amountInput.addEventListener(

"input",

()=>{


const amount =

Number(

amountInput.value

);



//-------------------
// EMPTY
//-------------------


if(

amountInput.value===""

){

amountError.innerText="";


amountInput.style.border=

"1px solid black";


return;


}




//-------------------
// MINIMUM
//-------------------


if(

amount<3000

){

amountError.innerText=

"Minimum withdrawal is NGN 3000.";


amountInput.style.border=

"2px solid red";


return;


}




//-------------------
// MAXIMUM
//-------------------


if(

amount>1000000

){

amountError.innerText=

"Maximum withdrawal is NGN 1,000,000.";


amountInput.style.border=

"2px solid red";


return;


}




//-------------------
// BALANCE
//-------------------


if(

amount>currentBalance

){

amountError.innerText=

"Exceeded balance amount.";


amountInput.style.border=

"2px solid red";


return;


}




//-------------------
// VALID
//-------------------


amountError.innerText="";


amountInput.style.border=

"1px solid black";


});





//=========================
// ACCOUNT NUMBER
//=========================

const accountNumber =

document.getElementById(

"account-number"

);


const numberError =

document.getElementById(

"number-error"

);



accountNumber.addEventListener(

"input",

()=>{


accountNumber.value =

accountNumber.value

.replace(/\D/g,'')

.substring(0,10);



if(

accountNumber.value===""

){

numberError.innerText="";


accountNumber.style.border=

"1px solid black";


return;


}



if(

accountNumber.value.length!==10

){

numberError.innerText=

"Account number must be 10 digits.";


accountNumber.style.border=

"2px solid red";


return;


}



numberError.innerText="";


accountNumber.style.border=

"1px solid black";


});






//=========================
// ACCOUNT NAME
//=========================

const accountName =

document.getElementById(

"account-name"

);


const nameError =

document.getElementById(

"name-error"

);



accountName.addEventListener(

"input",

()=>{


if(

accountName.value===""

){

nameError.innerText="";


accountName.style.border=

"1px solid black";


return;


}



if(

!/^[A-Za-z ]+$/

.test(

accountName.value

)

){

nameError.innerText=

"Only letters are allowed.";


accountName.style.border=

"2px solid red";


return;


}



nameError.innerText="";


accountName.style.border=

"1px solid black";


});






//=========================
// SELECT BANK
//=========================

const bank =

document.getElementById(

"bank"

);


const bankError =

document.getElementById(

"bank-error"

);



bank.addEventListener(

"change",

()=>{


if(

bank.value===""

){

bankError.innerText=

"Please select your bank.";


bank.style.border=

"2px solid red";


return;


}



bankError.innerText="";


bank.style.border=

"1px solid black";


});







//=========================
// CONFIRM BUTTON
//=========================

document.getElementById(

"confirm-btn"

).onclick = ()=>{


const amount =

Number(

amountInput.value

);



//-------------------
// AMOUNT
//-------------------

if(

amountInput.value===""

){

amountError.innerText=

"Please enter an amount.";


amountInput.style.border=

"2px solid red";


return;

}


if(

amount<3000

||

amount>1000000

||

amount>currentBalance

){

return;

}



//-------------------
// ACCOUNT NUMBER
//-------------------

if(

accountNumber.value===""

){

numberError.innerText=

"Please enter your account number.";


accountNumber.style.border=

"2px solid red";


return;

}


if(

accountNumber.value.length!==10

){

numberError.innerText=

"Account number must be 10 digits.";


accountNumber.style.border=

"2px solid red";


return;

}




//-------------------
// ACCOUNT NAME
//-------------------

if(

accountName.value.trim()===""

){

nameError.innerText=

"Please enter your account name.";


accountName.style.border=

"2px solid red";


return;

}


if(

!/^[A-Za-z ]+$/

.test(

accountName.value

)

){

nameError.innerText=

"Only letters are allowed.";


accountName.style.border=

"2px solid red";


return;

}



//-------------------
// BANK
//-------------------


if(

bank.value===""

){

bankError.innerText=

"Please select your bank.";


bank.style.border=

"2px solid red";


return;

}




//-------------------
// SUCCESS
//-------------------


window.location.href =

"withdraw-confirm.html";


};


};



//=========================
// BACK BUTTON
//=========================

document.getElementById(

"back-btn"

).onclick = ()=>{


window.location.href=

"profile.html";


};






//=========================
// PAGE LOADED
//=========================

console.log(

"WITHDRAW PAGE LOADED"

);
```

</script>


</body>
</html>
