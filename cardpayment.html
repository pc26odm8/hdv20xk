<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>ODDSUP | Card Payment</title>

<link rel="stylesheet"
href="cardpayment.css">

</head>

<body>


<div class="container">


<!--==================
       PAGE ONE
===================-->

<div id="payment-page">


<!-- HEADER -->

<header>

<img src="oddsuplogo.png"
class="header-logo"
alt="ODDSUP">


</header>




<!-- BALANCE -->

<section class="balance-box">

<h3>

CURRENT BALANCE

</h3>


<h2>

NGN <span id="balance">

0.00

</span>

</h2>

</section>




<!-- TITLE -->

<h3 class="deposit-title">

ADD NGN <span id="amount">

0

</span>

TO YOUR ODDSUP ACCOUNT

</h3>




<!-- CARD PAYMENT -->

<section class="card-box">


<h3>

CARD PAYMENT

</h3>




<!-- CARD NUMBER -->

<label>

Card Number

</label>


<input type="text"
id="card-number"
maxlength="19"
placeholder="4242 4242 4242 4242">



<p class="error-message"
id="card-error">

</p>





<!-- EXP & CVV -->

<div class="card-row">


<div>


<label>

CVV

</label>


<input type="text"
id="cvv"
maxlength="3"
placeholder="123">


<p class="error-message"
id="cvv-error">

</p>


</div>



<div>


<label>

Exp/Date

</label>


<input type="text"
id="expiry-date"
maxlength="5"
placeholder="12/26">


<p class="error-message"
id="date-error">

</p>


</div>


</div>





<!-- CARD HOLDER NAME -->

<label>

Card Holder Name

</label>


<input type="text"
id="card-name"
placeholder="E.g Joe Don">



<p class="error-message"
id="name-error">

</p>





<!-- BUTTONS -->

<div class="buttons">


<button id="back-btn">

&nbsp; BACK

</button>



<button id="pay-btn">

PAY

</button>


</div>



</section>


</div>





<!--==================
     LOADING OVERLAY
===================-->

<div id="loading-overlay"
class="hidden">


<div class="loader">

</div>


</div>






<!--==================
      ERROR PAGE
===================-->

<div id="error-page"
class="hidden">


<header>

<img src="oddsuplogo.png"
class="header-logo"
alt="ODDSUP">


</header>



<div class="error-box">


<h1>

!

</h1>



<h2>

ERROR 404

</h2>



<p>

PAYMENT API UNAVAILABLE

</p>



<p>

Please try another
payment option.

</p>




<button id="error-back">

< &nbsp; BACK

</button>



</div>


</div>



</div>




<script src="cardpayment.js">

</script>


</body>
</html>
